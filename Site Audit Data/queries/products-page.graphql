query ProductsPage($cursor: String) {
  products(first: 50, after: $cursor) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      title
      handle
      description
      descriptionHtml
      productType
      vendor
      tags
      templateSuffix
      status
      createdAt
      updatedAt
      seo {
        title
        description
      }
      options {
        id
        name
        position
        values
      }
      featuredMedia {
        id
        alt
        mediaContentType
        ... on MediaImage {
          image {
            url
            width
            height
            altText
          }
        }
      }
      media(first: 100) {
        nodes {
          id
          alt
          mediaContentType
          status
          ... on MediaImage {
            image {
              url
              width
              height
              altText
            }
          }
        }
      }
      variants(first: 100) {
        nodes {
          id
          title
          displayName
          sku
          barcode
          price
          compareAtPrice
          availableForSale
          inventoryPolicy
          inventoryQuantity
          selectedOptions {
            name
            value
          }
          image {
            id
            url
            width
            height
            altText
          }
        }
      }
      collections(first: 30) {
        nodes {
          id
          title
          handle
        }
      }
      metafields(first: 50, namespace: "custom") {
        nodes {
          namespace
          key
          type
          value
        }
      }
    }
  }
}
